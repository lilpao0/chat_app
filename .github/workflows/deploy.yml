name: Check and deploy backend

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chat_test
          POSTGRES_PASSWORD: chat_test
          POSTGRES_DB: chat_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_test -d chat_app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://chat_test:chat_test@127.0.0.1:5432/chat_app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test, vet and build
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go build ./...

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Show authenticated account
        run: gcloud auth list --filter=status:ACTIVE --format="value(account)"
      - name: Check source staging bucket access
        run: gcloud storage buckets describe gs://vinai-lab_cloudbuild --project=vinai-lab --format="value(name)"
      - name: Build and deploy API and cleanup
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gcloud builds submit --project vinai-lab \
            --config backend/cloudbuild.yaml \
            --substitutions "_SHA=$RELEASE_SHA" --quiet
